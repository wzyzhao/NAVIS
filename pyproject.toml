[project]
name = "navis"
version = "0.1.0"
description = "NAVIS: ACK-driven semantic video compression, transport and reconstruction"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["pyserial>=3.5,<4"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project.scripts]
scene-factorization = "scene_factorization.cli:main"

[tool.setuptools]
include-package-data = false

[project.optional-dependencies]
vision = ["numpy>=1.26.4,<2", "opencv-python>=4.10,<4.11", "pillow>=10,<13"]
dcvc = ["navis[vision]", "torch>=2.6,<3", "torchvision>=0.21,<1", "scipy>=1.11,<2", "matplotlib>=3.8,<4", "tqdm>=4.66,<5", "bd-metric>=0.1.5,<1", "pybind11>=2.12,<3", "mlcodec-extensions-cpp"]
elic = ["navis[vision]", "torch>=2.6,<3", "torchvision>=0.21,<1", "compressai>=1.2.8,<2", "pytorch-msssim>=1,<2", "tqdm>=4.66,<5"]
evaluation = ["navis[vision]", "ultralytics>=8.3,<9", "matplotlib>=3.8,<4"]
scene-factorization = ["navis[vision]", "scipy>=1.11,<2", "torch>=2.6,<3", "torchvision>=0.21,<1", "ultralytics>=8.3,<9"]
acceleration = ["numpy>=1.26.4,<2", "numba>=0.61,<0.66"]
reports = ["reportlab>=4.5.1,<5"]

[dependency-groups]
dev = ["ruff>=0.11,<1", "mypy>=1.15,<2", "pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["dcvc_compression*", "elic_jpg_compression*", "nbiot_transport*", "rebuild_video*", "scene_factorization*", "tools*", "common*"]
namespaces = false

[tool.uv.sources]
mlcodec-extensions-cpp = { path = "src/dcvc_compression/vendor/DCVC/src/cpp" }
torch = { index = "pytorch-cu130", marker = "sys_platform == 'win32'" }
torchvision = { index = "pytorch-cu130", marker = "sys_platform == 'win32'" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.extra-build-dependencies]
mlcodec-extensions-cpp = ["pybind11>=2.12,<3"]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["**/vendor/**", "**/.venv/**", "scene_factorization_output", "experiments/results"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
files = ["src/common", "src/rebuild_video/quality.py", "src/nbiot_transport/feedback/ack_utils.py"]
follow_imports = "silent"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
